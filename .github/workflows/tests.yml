# Gate for the card workflow (.claude/skills/pick-card): every PR must pass `just ci` before it
# may merge into main; the worker merges on its own once every check is green. Live suites (`Live…`, host Siril/GraXpert/StarNet, fixtures under
# ~/Documents/astro) self-skip on the runner; the full host suite runs locally via `just check`.
#
# The macOS job runs on the PO's Mac (self-hosted runner `[self-hosted, macOS, ARM64]`, PO decision
# 2026-10-20): GitHub's hosted macOS arm64 runners repeatedly failed to pick jobs up ("not acquired
# … even after multiple attempts", capacity constraints), and hosted macOS minutes bill at 10×.
# The Mac must be on with the runner started; it has the Command Line Tools, not Xcode, so the
# Xcode, Metal Toolchain and cache steps run only on a hosted image. `ASTROSTACK_SKIP_LIVE=1` makes
# the live suites skip as they do on a hosted runner, even though the fixtures are on that disk.
# Pull requests only (a squash-merged green PR *is* main); superseded runs are cancelled.
# Background: docs/engineering/swift-quality-playbook.md §9.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap Linux job (1× minutes): the suite may only grow. Deleting or editing an existing test,
  # or lowering the test count, needs a `Test-change:` line in the PR body (scripts/test-ratchet.sh).
  continuity:
    name: test continuity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: test ratchet
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: ./scripts/test-ratchet.sh "$BASE" HEAD
      - name: hygiene
        run: ./scripts/hygiene.sh

  swift:
    name: hygiene · lint · build · test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      PKG: apps/macos
      ASTROSTACK_SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: just
        run: command -v just >/dev/null || brew install just

      - name: Select the newest Xcode 26
        if: runner.environment == 'github-hosted'
        run: |
          xc="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$xc" ] || xc="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version
          swift --version

      # Metal Toolchain is a separate Xcode 26 component; its presence on the hosted image is
      # contested (runner-images #13080 vs #13014). Download it only when a package exists and
      # the compiler is missing — it is what turns .metal into .metallib.
      - name: Metal Toolchain
        if: runner.environment == 'github-hosted' && hashFiles('apps/macos/Package.swift') != ''
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent metalToolchain

      - name: SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      # A self-hosted runner keeps its workspace (and .build) between runs: no cache needed.
      - name: Cache SwiftPM build
        if: runner.environment == 'github-hosted' && hashFiles('apps/macos/Package.swift') != ''
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: just ci
        env:
          ATTACHMENTS_PATH: ${{ runner.temp }}/attachments
        run: |
          mkdir -p "$ATTACHMENTS_PATH"
          just ci

      # Diff images and other Attachment.record() outputs, kept only when something failed.
      - name: Upload test attachments
        if: failure() && hashFiles('apps/macos/Package.swift') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-attachments
          path: ${{ runner.temp }}/attachments
          if-no-files-found: ignore

      - name: Coverage
        if: hashFiles('apps/macos/Package.swift') != ''
        run: just coverage

      - name: Upload coverage
        if: hashFiles('apps/macos/Package.swift') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/macos/.build/coverage/lcov.info
            apps/macos/.build/coverage/summary.txt
            apps/macos/.build/coverage/lines.txt
