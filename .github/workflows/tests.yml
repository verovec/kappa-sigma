# Gate for the card workflow (.claude/skills/pick-card): every PR must pass `just ci` before it
# may merge into main. Live tests (host Siril/GraXpert/StarNet, fixtures under ~/Documents/astro)
# self-skip on the runner; the full host suite runs locally via `just check` before the PR.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift build · lint · test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" && xcodebuild -version
      - name: swift-format
        run: which swift-format || brew install swift-format
      - run: just ci
